[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressb"
version = "0.1.0"
description = "S1B elevator button agent: robot control service plus Thor / external model API"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy<2", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pressb*"]

[tool.pytest.ini_options]
# scripts holds the launcher entry points imported by tests.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
